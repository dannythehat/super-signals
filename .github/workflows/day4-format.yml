name: Day 4 Python formatter

on:
  push:
    branches:
      - feature/day-04-postgresql-core-model

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-04-postgresql-core-model

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format Python files
        run: |
          python -m pip install "ruff>=0.8,<1"
          python -m ruff check services/api --fix
          python -m ruff format services/api

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api
          git commit -m "style: format Day 4 Python code"
          git push origin HEAD:feature/day-04-postgresql-core-model
