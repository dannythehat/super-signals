name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_SECRET || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: super-signals
      VITE_API_BASE_URL: /api
      VITE_DEPLOYMENT_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm Cloudflare token is available
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No supported Cloudflare token secret was found."
            echo "Expected one of: CLOUDFLARE_API_TOKEN, CLOUDFLARE_TOKEN, CLOUDFLARE_SECRET, CF_API_TOKEN."
            exit 1
          fi

      - name: Resolve Cloudflare account
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Using the configured Cloudflare account ID."
            exit 0
          fi

          response=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          account_id=$(node -e '
            const response = JSON.parse(process.argv[1]);
            if (!response.success || !Array.isArray(response.result) || response.result.length !== 1) {
              process.exit(1);
            }
            process.stdout.write(response.result[0].id);
          ' "$response")

          if [ -z "$account_id" ]; then
            echo "Cloudflare account ID could not be resolved automatically."
            echo "Add a repository secret named CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build:web

      - name: Deploy to Cloudflare Pages
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$branch" \
            --commit-hash "$GITHUB_SHA"
