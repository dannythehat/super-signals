name: Deploy Super Signals

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-signals-deploy-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_SECRET || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a517d133ccec0093de719211a6694951
      WORKER_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'super-signals' || 'super-signals-preview' }}
      VITE_DEPLOYMENT_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VITE_API_BASE_URL: /api
      WORKERS_SUBDOMAIN: dannythehat2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Build web app
        run: npm run build:web

      - name: Deploy to Cloudflare Workers
        run: npx --no-install wrangler deploy --config wrangler.jsonc --name "$WORKER_NAME"

      - name: Verify deployed app
        run: |
          url="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$url" | grep -q "Super Signals"; then
              echo "Verified $url"
              exit 0
            fi
            sleep 3
          done
          echo "Deployment did not return the Super Signals app at $url"
          exit 1
