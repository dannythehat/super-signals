name: Day 5 frontend formatter

on:
  push:
    branches:
      - feature/day-05-secure-owner-auth

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-05-secure-owner-auth
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format frontend
        run: npx prettier --write apps/web/src/App.tsx apps/web/src/styles.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/styles.css
          git commit -m "style: format Day 5 frontend"
          git push
