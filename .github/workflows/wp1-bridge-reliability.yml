name: WP1 bridge reliability (offline)
on:
  pull_request:
    paths: ['services/local_mt5_bridge/**', 'services/api/app/routes/health.py', 'services/api/app/routes/server_monitor.py', 'services/api/tests/test_server_monitor_freshness.py', '.github/workflows/wp1-bridge-reliability.yml']
permissions:
  contents: read
jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install httpx
      - run: python -m unittest discover -s services/local_mt5_bridge/tests -v
      - shell: pwsh
        run: ./services/local_mt5_bridge/tests/test_watchdog_identity.ps1
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/api/requirements.txt pytest pytest-asyncio
      - name: Offline API regression tests
        env:
          PYTHONPATH: services/api
        run: python -m pytest -q services/api/tests/test_health.py services/api/tests/test_server_monitor_freshness.py services/api/tests/test_local_mt5_bridge.py services/api/tests/test_pu_bridge_scope.py
