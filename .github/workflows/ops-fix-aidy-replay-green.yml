name: Ops Fix AIDY Replay Green

on:
  push:
    branches: [feature/aidy-provider-lab-market-truth]
    paths:
      - ".github/ops/fix_aidy_replay_green.py"
      - ".github/workflows/ops-fix-aidy-replay-green.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: super_signals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d super_signals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/super_signals_test
      OWNER_EMAIL: owner@example.com
      OWNER_DISPLAY_NAME: Owner
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aidy-provider-lab-market-truth
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic patch
        run: python .github/ops/fix_aidy_replay_green.py

      - name: Install API dependencies
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile
        run: PYTHONPATH=services/api python -m compileall -q services/api/app services/api/migrations services/api/tests

      - name: Focused adversarial and non-blocking tests
        run: |
          PYTHONPATH=services/api python -m pytest -q \
            services/api/tests/test_aidy_provider_lab_market_truth.py \
            services/api/tests/test_provider_lab_public_market_data.py \
            services/api/tests/test_provider_fairness_v2.py

      - name: Full API regression
        run: PYTHONPATH=services/api python -m pytest -q services/api/tests

      - name: Commit only verified production changes
        run: |
          set -euo pipefail
          rm -f .github/ops/fix_aidy_replay_green.py .github/workflows/ops-fix-aidy-replay-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix AIDY replay lifecycle prefix and event-loop regression"
          git push origin HEAD:feature/aidy-provider-lab-market-truth
