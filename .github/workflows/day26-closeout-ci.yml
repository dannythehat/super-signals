name: Day 26 closeout CI

on:
  push:
    branches:
      - agent/day26-closeout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  day26-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: super_signals_test
          POSTGRES_USER: super_signals
          POSTGRES_PASSWORD: super_signals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U super_signals -d super_signals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://super_signals:super_signals@127.0.0.1:5432/super_signals_test
      SUPER_SIGNALS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Day 26 modules
        run: |
          python -m py_compile services/api/app/ai_message_supervisor.py
          python -m py_compile services/api/app/metaapi_trade_gateway.py
          python -m py_compile services/api/app/mt5_execution_day26.py
          python -m py_compile services/api/app/mt5_execution_day26_atomic.py
      - name: Verify migration chain
        working-directory: services/api
        run: alembic upgrade head
      - name: Run AI and Day 23-26 tests
        run: >-
          pytest -q
          services/api/tests/test_ai_message_supervisor.py
          services/api/tests/test_day23_mt5_read.py
          services/api/tests/test_day24_risk_sizing.py
          services/api/tests/test_day25_trade_preflight.py
          services/api/tests/test_day26_multi_tp_execution.py
          services/api/tests/test_day26_atomic_rollback.py
