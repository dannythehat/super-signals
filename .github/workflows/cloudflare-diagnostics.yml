name: Cloudflare build diagnostics

on:
  push:
    branches:
      - feature/day-03-cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_SECRET || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a517d133ccec0093de719211a6694951
      CLOUDFLARE_BUILD_ID: 3185febd-daab-4dc0-9268-6cda5f70d30c
    steps:
      - name: Confirm token exists
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare token secret is missing."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Fetch Cloudflare build logs
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/builds/$CLOUDFLARE_BUILD_ID/logs" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          node - <<'NODE' "$response"
          const payload = JSON.parse(process.argv[2]);
          if (!payload.success) {
            console.error(JSON.stringify(payload.errors || payload, null, 2));
            process.exit(1);
          }

          const lines = payload.result?.lines || [];
          for (const item of lines) {
            if (Array.isArray(item)) {
              console.log(item.slice(1).join(' '));
            } else {
              console.log(String(item));
            }
          }
          NODE
