name: Day 4 CSS formatter

on:
  push:
    branches:
      - feature/day-04-postgresql-core-model

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-04-postgresql-core-model
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format CSS
        run: npx prettier --write apps/web/src/styles.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format branded app CSS"
          git push
