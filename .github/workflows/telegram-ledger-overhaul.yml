name: Telegram Ledger Overhaul Gate

on:
  pull_request:
    branches: [feature/day-10-shared-telegram-sources]
    paths:
      - "services/api/app/day27_management_policy.py"
      - "services/api/app/provider_risk_policy.py"
      - "services/api/app/paper_run_epoch.py"
      - "services/api/app/trading_accounting.py"
      - "services/api/app/routes/gold_quote.py"
      - "services/api/app/telegram_trade_ledger.py"
      - "services/api/app/telegram_publisher_canonical.py"
      - "services/api/app/scheduled_performance_reports_day34.py"
      - "services/api/app/summary_notifications_day34.py"
      - "services/api/tests/test_day27_management_policy.py"
      - "services/api/tests/test_v1_message_policy.py"
      - "services/api/tests/test_fxtradingvision_risk_policy.py"
      - "services/api/tests/test_tig_asia_one_percent_policy.py"
      - "services/api/tests/test_canonical_paper_run_epoch.py"
      - "services/api/tests/test_canonical_performance_truth.py"
      - "services/api/tests/test_scheduled_performance_reports_day34.py"
      - "services/api/tests/test_telegram_trade_ledger.py"
      - ".github/workflows/telegram-ledger-overhaul.yml"

permissions:
  contents: read

jobs:
  telegram-ledger-overhaul:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API test dependencies
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install pytest pytest-asyncio ruff
      - name: Compile changed modules
        run: |
          PYTHONPATH=services/api python -m compileall -q             services/api/app/day27_management_policy.py             services/api/app/provider_risk_policy.py             services/api/app/paper_run_epoch.py             services/api/app/trading_accounting.py             services/api/app/routes/gold_quote.py             services/api/app/telegram_trade_ledger.py             services/api/app/telegram_publisher_canonical.py             services/api/app/scheduled_performance_reports_day34.py             services/api/app/summary_notifications_day34.py
      - name: Lint changed modules and focused tests
        run: |
          python -m ruff check             services/api/app/day27_management_policy.py             services/api/app/provider_risk_policy.py             services/api/app/paper_run_epoch.py             services/api/app/telegram_trade_ledger.py             services/api/tests/test_telegram_trade_ledger.py
      - name: Run focused regression suite
        run: |
          PYTHONPATH=services/api python -m pytest -q             services/api/tests/test_day27_management_policy.py             services/api/tests/test_v1_message_policy.py             services/api/tests/test_fxtradingvision_risk_policy.py             services/api/tests/test_tig_asia_one_percent_policy.py             services/api/tests/test_canonical_paper_run_epoch.py             services/api/tests/test_canonical_performance_truth.py             services/api/tests/test_scheduled_performance_reports_day34.py             services/api/tests/test_telegram_trade_ledger.py
