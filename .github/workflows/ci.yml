name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: super_signals_test
          POSTGRES_USER: super_signals
          POSTGRES_PASSWORD: super_signals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U super_signals -d super_signals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://super_signals:super_signals@127.0.0.1:5432/super_signals_test
      SUPER_SIGNALS_OWNER_EMAIL: owner@super-signals.test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: super_signals
      PGPASSWORD: super_signals
      PGDATABASE: super_signals_test

    steps:
      - name: Check out exact commit without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Verify runner toolchain
        shell: bash
        run: |
          node --version
          npm --version
          python3 --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) process.exit(1)'
          python3 -c 'import sys; assert sys.version_info >= (3, 12)'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install locked web dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Create isolated Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt "pip-audit>=2,<3"

      - name: Audit declared Python dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Run all checks
        run: npm run check

      - name: Verify database backup and restore
        run: scripts/verify_database_backup.sh
