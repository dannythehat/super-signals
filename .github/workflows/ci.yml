name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql+psycopg://super_signals:super_signals@127.0.0.1:5432/super_signals_test
      SUPER_SIGNALS_OWNER_EMAIL: owner@super-signals.test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: super_signals
      PGPASSWORD: super_signals
      PGDATABASE: super_signals_test

    steps:
      - name: Check out exact commit without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Select hosted Node and Python toolchains
        shell: bash
        run: |
          node_bin="$(find /opt/hostedtoolcache/node -path '*/x64/bin/node' -type f | sort -V | tail -n 1)"
          python_bin="$(find /opt/hostedtoolcache/Python -path '*/x64/bin/python' -type f | sort -V | tail -n 1)"
          test -x "$node_bin"
          test -x "$python_bin"
          node_dir="$(dirname "$node_bin")"
          echo "$node_dir" >> "$GITHUB_PATH"
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
          export PATH="$node_dir:$PATH"
          node --version
          npm --version
          "$python_bin" --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 20 || (major === 20 && minor < 19)) process.exit(1)'
          "$python_bin" -c 'import sys; assert sys.version_info >= (3, 11)'

      - name: Start isolated PostgreSQL database
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          sudo service postgresql start
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE USER super_signals WITH PASSWORD 'super_signals';
          CREATE DATABASE super_signals_test OWNER super_signals;
          SQL
          pg_isready --host=127.0.0.1 --port=5432 --username=super_signals --dbname=super_signals_test

      - name: Install locked web dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Create isolated Python environment
        shell: bash
        run: |
          "$PYTHON_BIN" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt "pip-audit>=2,<3"

      - name: Audit declared Python dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Run all checks
        run: npm run check

      - name: Verify database backup and restore
        run: scripts/verify_database_backup.sh
