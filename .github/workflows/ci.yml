name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: super_signals_test
          POSTGRES_USER: super_signals
          POSTGRES_PASSWORD: super_signals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U super_signals -d super_signals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://super_signals:super_signals@127.0.0.1:5432/super_signals_test
      SUPER_SIGNALS_OWNER_EMAIL: owner@super-signals.test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install web dependencies
        run: npm install

      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run all checks
        run: npm run check
