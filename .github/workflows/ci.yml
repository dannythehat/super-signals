# Manual-only by design. Development commits must not consume GitHub Actions minutes.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://super_signals:super_signals@127.0.0.1:5432/super_signals_test
      SUPER_SIGNALS_OWNER_EMAIL: owner@super-signals.test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: super_signals
      PGPASSWORD: super_signals
      PGDATABASE: super_signals_test
      PGADMINUSER: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare isolated PostgreSQL database
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE USER super_signals WITH PASSWORD 'super_signals';
          CREATE DATABASE super_signals_test OWNER super_signals;
          SQL

      - name: Install locked web dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt "pip-audit>=2,<3"

      - name: Audit declared Python dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Run all checks
        run: npm run check

      - name: Verify database backup and restore
        run: scripts/verify_database_backup.sh
