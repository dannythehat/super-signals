name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql+psycopg://super_signals:super_signals@127.0.0.1:5432/super_signals_test
      SUPER_SIGNALS_OWNER_EMAIL: owner@super-signals.test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: super_signals
      PGPASSWORD: super_signals
      PGDATABASE: super_signals_test
      PGADMINUSER: postgres

    steps:
      - name: Check out exact commit without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          encoded_token="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${encoded_token}" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Verify hosted Node and Python toolchains
        shell: bash
        run: |
          python_bin="$(command -v python3)"
          test -x "$python_bin"
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
          node --version
          npm --version
          "$python_bin" --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 20 || (major === 20 && minor < 19)) process.exit(1)'
          "$python_bin" -c 'import sys; assert sys.version_info >= (3, 11)'

      - name: Start isolated PostgreSQL database
        shell: bash
        run: |
          brew install postgresql@16
          postgres_bin="$(brew --prefix postgresql@16)/bin"
          echo "$postgres_bin" >> "$GITHUB_PATH"
          export PATH="$postgres_bin:$PATH"
          postgres_data="$RUNNER_TEMP/postgres-data"
          initdb --pgdata="$postgres_data" --username=postgres --auth=trust
          pg_ctl --pgdata="$postgres_data" --options="-h 127.0.0.1 -p 5432" --wait start
          PGUSER=postgres psql --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE USER super_signals WITH PASSWORD 'super_signals';
          CREATE DATABASE super_signals_test OWNER super_signals;
          SQL
          pg_isready --host=127.0.0.1 --port=5432 --username=super_signals --dbname=super_signals_test

      - name: Install locked web dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Create isolated Python environment
        shell: bash
        run: |
          "$PYTHON_BIN" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt "pip-audit>=2,<3"

      - name: Audit declared Python dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Run all checks
        run: npm run check

      - name: Verify database backup and restore
        run: scripts/verify_database_backup.sh

  deployment-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact commit without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          encoded_token="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${encoded_token}" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Build one-click deployment image
        run: docker build --tag super-signals-day8:ci .
