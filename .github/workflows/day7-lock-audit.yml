name: Day 7 dependency lock and audit

on:
  push:
    branches:
      - feature/day-07-foundation-pass-gate

permissions:
  contents: write

jobs:
  lock-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-07-foundation-pass-gate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible dependency lock
        run: npm install --package-lock-only

      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-all.json', 'utf8'));
          const vulnerabilities = Object.fromEntries(
            Object.entries(report.vulnerabilities || {}).map(([name, item]) => [name, {
              severity: item.severity,
              direct: item.isDirect,
              via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : {
                source: entry.source,
                name: entry.name,
                severity: entry.severity,
                title: entry.title,
                range: entry.range,
              }),
              effects: item.effects,
              range: item.range,
              nodes: item.nodes,
              fixAvailable: item.fixAvailable,
            }]),
          );
          console.log(JSON.stringify({metadata: report.metadata, vulnerabilities}, null, 2));
          if ((report.metadata?.vulnerabilities?.total || 0) > 0) {
            process.exitCode = 1;
          }
          NODE

      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-production.json', 'utf8'));
          const total = report.metadata?.vulnerabilities?.total || 0;
          console.log('PRODUCTION_AUDIT=' + JSON.stringify(report.metadata?.vulnerabilities || {}));
          if (total > 0) process.exitCode = 1;
          NODE

      - name: Commit lockfile
        if: always()
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependencies"
          git push
