name: Ops AIDY Runtime Wire 20260905

on:
  push:
    branches:
      - fix/aidy-resolver-app-startup-20260905
    paths:
      - .github/workflows/ops-aidy-runtime-wire-20260905.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aidy-resolver-app-startup-20260905
          fetch-depth: 0
      - name: Patch app-owned AIDY startup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/app/main.py')
          text = path.read_text(encoding='utf-8')

          old = 'from app.db import get_session_factory\n'
          new = old + 'from app.aidy_shadow_runtime import AidyShadowRuntime\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    session_factory = get_session_factory()\n\n    if os.getenv("SUPER_SIGNALS_DAY26_CODE_PROBE", "").strip() == "1":\n'''
          new = '''    session_factory = get_session_factory()\n    aidy_shadow_runtime = AidyShadowRuntime(session_factory)\n    application.state.aidy_shadow_runtime = aidy_shadow_runtime\n    await aidy_shadow_runtime.start()\n\n    if os.getenv("SUPER_SIGNALS_DAY26_CODE_PROBE", "").strip() == "1":\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            except asyncio.CancelledError:\n                pass\n        await publisher.stop()\n'''
          new = '''            except asyncio.CancelledError:\n                pass\n        await aidy_shadow_runtime.stop()\n        await publisher.stop()\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- services/api/app/main.py
      - name: Commit minimal wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ops-aidy-runtime-wire-20260905.yml
          git add services/api/app/main.py
          git commit -m "Wire AIDY resolver into app lifespan"
          git push origin HEAD:fix/aidy-resolver-app-startup-20260905
