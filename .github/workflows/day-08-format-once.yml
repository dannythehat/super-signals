name: Day 8 format once

on:
  push:
    branches:
      - feature/day-08-secure-telegram-connection

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out exact branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          encoded_token="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${encoded_token}" fetch --no-tags --depth=1 origin "refs/heads/${GITHUB_REF_NAME}"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Apply canonical Python formatting
        run: |
          python -m pip install "ruff==0.16.1"
          python -m ruff format services/api
          rm .github/workflows/day-08-format-once.yml

      - name: Commit formatting and remove this workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api .github/workflows/day-08-format-once.yml
          git commit -m "style(telegram): apply canonical Python formatting"
          encoded_token="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${encoded_token}" push origin "HEAD:${GITHUB_REF_NAME}"
