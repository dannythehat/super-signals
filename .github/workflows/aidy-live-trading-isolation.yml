name: AIDY Live-Trading Isolation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "services/api/app/db.py"
      - "services/api/app/main.py"
      - "services/api/app/aidy_shadow_runtime.py"
      - "services/api/tests/test_aidy_shadow_runtime_startup.py"
      - ".github/workflows/aidy-live-trading-isolation.yml"

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API and tests
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install pytest pytest-asyncio ruff
      - name: Compile isolation surface
        run: |
          PYTHONPATH=services/api python -m compileall -q             services/api/app/db.py             services/api/app/main.py             services/api/app/aidy_shadow_runtime.py             services/api/tests/test_aidy_shadow_runtime_startup.py
      - name: Lint isolation surface
        run: |
          python -m ruff check services/api/app/db.py services/api/app/aidy_shadow_runtime.py services/api/tests/test_aidy_shadow_runtime_startup.py
      - name: Run isolation regressions
        run: |
          PYTHONPATH=services/api python -m pytest -q             services/api/tests/test_aidy_shadow_runtime_startup.py
