name: Day 11 allocation cleanup

on:
  pull_request:
    branches:
      - feature/day-10-shared-telegram-sources

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'provider-intelligence/day11-widened-reconciliation-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: provider-intelligence/day11-widened-reconciliation-20260907
          fetch-depth: 0
      - run: python .github/day11_cleanup.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/day11_cleanup.py .github/workflows/day11-cleanup-apply.yml
          git add services/api/app/paper_critical_execution.py services/api/app/trading_execution_canonical.py
          git commit -m 'Remove duplicate Day 11 allocation methods'
          git push origin HEAD:provider-intelligence/day11-widened-reconciliation-20260907
