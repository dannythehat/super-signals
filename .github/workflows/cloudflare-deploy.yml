name: Deploy Super Signals frontend

# Production deploy path restored on 2026-08-28.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-signals-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_BASE_URL: /api
      VITE_DEPLOYMENT_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build:web

      - name: Verify Cloudflare credential is available
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          npx wrangler whoami

      - name: Deploy production Worker
        run: npx wrangler deploy --name super-signals
