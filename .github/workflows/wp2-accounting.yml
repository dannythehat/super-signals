name: WP2 accounting regressions (isolated test ledger)
on:
  pull_request:
    paths: ['services/api/app/performance_ledger*', 'services/api/app/broker_fill_settlement.py', 'services/api/app/running_daily_balance.py', 'services/api/app/routes/gold_quote.py', 'services/api/tests/test_wp2*', 'services/local_mt5_bridge/**', '.github/workflows/wp2-accounting.yml']
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: super_signals_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d super_signals_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/super_signals_test
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/api/requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q services/api/tests/test_wp2_accounting.py services/api/tests/test_wp2_accounting_postgres.py services/api/tests/test_broker_fill_settlement.py services/api/tests/test_canonical_performance_truth.py services/api/tests/test_day33_performance_ledger.py services/api/tests/test_telegram_member_format.py services/api/tests/test_telegram_trade_ledger.py
      - run: python -m unittest discover -s services/local_mt5_bridge/tests -v
