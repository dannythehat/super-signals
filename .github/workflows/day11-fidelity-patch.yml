name: Day 11 fidelity patch

on:
  push:
    branches:
      - provider-intelligence/day11-widened-reconciliation-20260907
    paths:
      - .github/workflows/day11-fidelity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: provider-intelligence/day11-widened-reconciliation-20260907
          fetch-depth: 0
      - name: Apply exact scoped fidelity changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          helper = '''from __future__ import annotations

from dataclasses import dataclass
from decimal import Decimal
from typing import Generic, TypeVar

TEntry = TypeVar("TEntry")


@dataclass(frozen=True, slots=True)
class LayerAllocation(Generic[TEntry]):
    entry: TEntry
    tp_index: int
    take_profit: Decimal | None


def allocate_entry_targets(
    entries: tuple[TEntry, ...],
    targets: tuple[Decimal | None, ...],
) -> tuple[LayerAllocation[TEntry], ...]:
    """Pure canonical entry/target allocation shared by execution and calibration."""
    if not entries:
        raise ValueError("critical_entry_plan_missing")
    if not targets:
        raise ValueError("position_count_invalid")
    slot_count = max(len(entries), len(targets))
    has_runner = targets[-1] is None
    target_indexes = list(range(1, len(targets) + 1))
    if slot_count > len(targets):
        repeatable = list(range(1, len(targets) if has_runner else len(targets) + 1))
        if not repeatable:
            raise ValueError("position_count_invalid")
        for offset in range(slot_count - len(targets)):
            target_indexes.append(repeatable[offset % len(repeatable)])
    allocations = [
        LayerAllocation(
            entry=entries[index % len(entries)],
            tp_index=target_index,
            take_profit=targets[target_index - 1],
        )
        for index, target_index in enumerate(target_indexes)
    ]
    if has_runner:
        runner_slot = next(
            index for index, item in enumerate(allocations) if item.take_profit is None
        )
        best_entry = entries[-1]
        if getattr(allocations[runner_slot].entry, "entry_index") != getattr(best_entry, "entry_index"):
            best_slot = next(
                index
                for index, item in enumerate(allocations)
                if getattr(item.entry, "entry_index") == getattr(best_entry, "entry_index")
                and item.take_profit is not None
            )
            runner_item = allocations[runner_slot]
            best_item = allocations[best_slot]
            allocations[runner_slot] = LayerAllocation(
                entry=best_item.entry,
                tp_index=runner_item.tp_index,
                take_profit=runner_item.take_profit,
            )
            allocations[best_slot] = LayerAllocation(
                entry=runner_item.entry,
                tp_index=best_item.tp_index,
                take_profit=best_item.take_profit,
            )
    return tuple(allocations)
'''
          (ROOT / 'services/api/app/layer_allocation.py').write_text(helper, encoding='utf-8')

          def patch_live_allocation(rel: str) -> None:
              path = ROOT / rel
              text = path.read_text(encoding='utf-8')
              import_line = 'from app.layer_allocation import allocate_entry_targets\n'
              if import_line not in text:
                  marker = 'from app.critical_entry_policy import CriticalEntry, parse_critical_entries\n'
                  if marker not in text:
                      raise SystemExit(f'import marker missing in {rel}')
                  text = text.replace(marker, marker + import_line, 1)
              start = text.find('    @staticmethod\n    def _allocation_pairs(')
              if start < 0:
                  raise SystemExit(f'allocation method missing in {rel}')
              candidates = []
              for marker in ('\n    @', '\n    def ', '\n    async def '):
                  idx = text.find(marker, start + 10)
                  if idx >= 0:
                      candidates.append(idx)
              end = min(candidates)
              wrapper = '''    @staticmethod
    def _allocation_pairs(
        entries: tuple[CriticalEntry, ...],
        targets: tuple[Decimal | None, ...],
    ) -> tuple[AtomicLayerAllocation, ...]:
        try:
            shared = allocate_entry_targets(entries, targets)
        except ValueError as exc:
            raise Day26ExecutionError(str(exc)) from exc
        return tuple(
            AtomicLayerAllocation(
                entry=item.entry,
                tp_index=item.tp_index,
                take_profit=item.take_profit,
            )
            for item in shared
        )
'''
              text = text[:start] + wrapper + text[end:]
              path.write_text(text, encoding='utf-8')

          patch_live_allocation('services/api/app/paper_critical_execution.py')
          patch_live_allocation('services/api/app/trading_execution_canonical.py')

          replay_path = ROOT / 'services/api/app/provider_day11_replay.py'
          replay = replay_path.read_text(encoding='utf-8')
          import_marker = 'from app.aidy_market_client import AidyM1Bar, AidyMarketClient\n'
          shared_import = 'from app.layer_allocation import LayerAllocation\n'
          if shared_import not in replay:
              replay = replay.replace(import_marker, import_marker + shared_import, 1)

          geometry_fn = '''def _geometry_for_entry(
    *,
    signal: dict[str, Any],
    entry: Any,
    targets: tuple[Decimal, ...],
    leg_plan: tuple[tuple[int, Decimal | None], ...] | None = None,
) -> OriginalGeometry:
    stop = _decimal_required(signal.get("stop_loss"), field="stop_loss")
    if leg_plan is None:
        legs: list[dict[str, Any]] = [
            {"tp_index": index, "target_price": str(target), "is_runner": False}
            for index, target in enumerate(targets, start=1)
        ]
        if bool(signal.get("has_open_runner")):
            legs.append({"tp_index": len(legs) + 1, "target_price": None, "is_runner": True})
    else:
        legs = [
            {
                "tp_index": int(tp_index),
                "target_price": None if target is None else str(target),
                "is_runner": target is None,
            }
            for tp_index, target in leg_plan
        ]
    payload = {
        "side": str(signal["side"]),
        "entry_order_type": str(entry.order_type),
        "entry_low": str(entry.low),
        "entry_high": str(entry.high),
        "initial_stop": str(stop),
        "entry_index": int(entry.entry_index),
        "legs": legs,
    }
    return OriginalGeometry.from_payload(payload)


'''
          replay, n = re.subn(
              r'def _geometry_for_entry\(.*?(?=async def _fetch_bars)',
              geometry_fn,
              replay,
              count=1,
              flags=re.S,
          )
          if n != 1:
