          aidy = aidy.replace(
              '_MAX_WINDOW = timedelta(hours=48)\n',
              '_MAX_WINDOW = timedelta(hours=48)\n_CALIBRATION_RETRY_ATTEMPTS = 3\n_CALIBRATION_RETRY_BASE_SECONDS = 0.2\n',
              1,
          )
          old = '''        async with httpx.AsyncClient(timeout=httpx.Timeout(self._timeout_seconds)) as client:
            response = await client.get(
                f"{self._base_url}{path}?{raw_query}",
                headers=self._headers(),
            )
            response.raise_for_status()
            payload = response.json()
        if not isinstance(payload, dict) or payload.get("ok") is not True:
            raise RuntimeError("AIDY calibration market provider returned a non-success payload.")
'''
          new = '''        async with httpx.AsyncClient(timeout=httpx.Timeout(self._timeout_seconds)) as client:
            for attempt in range(_CALIBRATION_RETRY_ATTEMPTS):
                response = await client.get(
                    f"{self._base_url}{path}?{raw_query}",
                    headers=self._headers(),
                )
                if response.status_code in {500, 503} and attempt + 1 < _CALIBRATION_RETRY_ATTEMPTS:
                    await asyncio.sleep(_CALIBRATION_RETRY_BASE_SECONDS * (2 ** attempt))
                    continue
                response.raise_for_status()
                payload = response.json()
                break
            else:  # pragma: no cover - loop is bounded and always exits via response/exception
                raise RuntimeError("AIDY calibration retry bound exhausted.")
        if not isinstance(payload, dict) or payload.get("ok") is not True:
            raise RuntimeError("AIDY calibration market provider returned a non-success payload.")
'''
          if old not in aidy:
              raise SystemExit('calibration fetch block not found')
          aidy = aidy.replace(old, new, 1)
          aidy_path.write_text(aidy, encoding='utf-8')

          tests = '''from __future__ import annotations

from dataclasses import dataclass
from decimal import Decimal
from pathlib import Path

from app.layer_allocation import allocate_entry_targets

ROOT = Path(__file__).resolve().parents[1]


@dataclass(frozen=True)
