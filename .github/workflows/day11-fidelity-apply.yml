name: Day 11 fidelity apply

on:
  pull_request:
    branches:
      - feature/day-10-shared-telegram-sources

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'provider-intelligence/day11-widened-reconciliation-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: provider-intelligence/day11-widened-reconciliation-20260907
          fetch-depth: 0
      - name: Apply fidelity patch
        run: python .github/day11_fidelity_apply.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/day11_fidelity_apply.py .github/workflows/day11-fidelity-apply.yml .github/workflows/day11-fidelity-patch.yml
          git add services/api/app/layer_allocation.py \
                  services/api/app/paper_critical_execution.py \
                  services/api/app/trading_execution_canonical.py \
                  services/api/app/provider_day11_replay.py \
                  services/api/app/provider_day11_calibration_replay.py \
                  services/api/app/aidy_market_client.py \
                  services/api/tests/test_provider_day11_fidelity_closure.py
          git commit -m 'Fix Day 11 paper reconciliation fidelity'
          git push origin HEAD:provider-intelligence/day11-widened-reconciliation-20260907
