[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
