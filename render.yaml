services:
  - type: web
    name: super-signals-day-8
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/dannythehat/super-signals
    branch: feature/day-10-shared-telegram-sources
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: SUPER_SIGNALS_ENV
        value: preview
      - key: DATABASE_URL
        fromDatabase:
          name: super-signals-day-8-db
          property: connectionString
      - key: SUPER_SIGNALS_CORS_ORIGINS
        value: https://same-origin-only.invalid
      - key: SUPER_SIGNALS_COOKIE_SECURE
        value: "true"
      - key: SUPER_SIGNALS_SESSION_COOKIE
        value: super_signals_day8_session
      - key: SUPER_SIGNALS_SESSION_TTL_SECONDS
        value: "28800"
      - key: SUPER_SIGNALS_FINGERPRINT_SECRET
        generateValue: true
      - key: SUPER_SIGNALS_TELEGRAM_SESSION_SECRET
        generateValue: true
      - key: SUPER_SIGNALS_TELEGRAM_QR_TTL_SECONDS
        value: "120"
      - key: SUPER_SIGNALS_OWNER_DISPLAY_NAME
        value: Danny
      - key: SUPER_SIGNALS_OWNER_EMAIL
        sync: false
      - key: SUPER_SIGNALS_OWNER_PASSWORD
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false

databases:
  - name: super-signals-day-8-db
    plan: free
    region: frankfurt
    databaseName: super_signals
    user: super_signals
