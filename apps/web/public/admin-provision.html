<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Super Signals — Add Trading Admin</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#073433 0,#02151d 32%,#020710 70%);color:#f4f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 18px}.shell{width:min(620px,100%);margin:0 auto}.logo{display:block;width:min(360px,80vw);height:auto;margin:0 auto 24px}.card{background:rgba(6,17,29,.94);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.eyebrow{color:#58e3cf;font-size:.82rem;letter-spacing:.22em;font-weight:800;text-transform:uppercase}.card h1{font-size:clamp(2rem,8vw,3.3rem);line-height:1.02;margin:12px 0 16px}.intro{color:#aab4c3;line-height:1.6;margin:0 0 22px}.form{display:grid;gap:17px}.form label{display:grid;gap:8px;font-weight:700}.form input,.linkbox{width:100%;border:1px solid rgba(255,255,255,.14);background:#0c1621;color:#fff;border-radius:15px;padding:15px 16px;font:inherit}.button{border:0;border-radius:15px;padding:15px 18px;font:inherit;font-weight:900;background:linear-gradient(110deg,#26ded2,#7cff48);color:#03120e;cursor:pointer}.button.secondary{background:#111c28;color:#f5f7fa;border:1px solid rgba(255,255,255,.13)}.button:disabled{opacity:.55}.notice{margin:16px 0;padding:14px 16px;border-radius:14px;line-height:1.45}.notice.ok{background:rgba(66,219,151,.11);border:1px solid rgba(66,219,151,.25);color:#bff5dc}.notice.err{background:rgba(255,106,124,.1);border:1px solid rgba(255,106,124,.25);color:#ffc1c9}.result{display:none;margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.09)}.result.show{display:grid;gap:12px}.result small{color:#8e9bab;line-height:1.5}.back{display:inline-block;margin-top:16px;color:#95a5b7;text-decoration:none}
  </style>
</head>
<body>
  <main class="shell">
    <img class="logo" src="/super-signals-logo.png" alt="Super Signals" />
    <section class="card">
      <div class="eyebrow">Owner only</div>
      <h1>Add a Trading Admin</h1>
      <p class="intro">Whitelist the administrator’s email and create a single-use setup link. They choose their own password. You never need to know it.</p>
      <div id="notice"></div>
      <form id="form" class="form">
        <label>Name<input id="name" name="display_name" value="Rikke" maxlength="120" required /></label>
        <label>Email<input id="email" name="email" type="email" required /></label>
        <button id="submit" class="button" type="submit">Whitelist & create setup link</button>
      </form>
      <div id="result" class="result">
        <label>One-time setup link<textarea id="setupLink" class="linkbox" rows="5" readonly></textarea></label>
        <button id="copy" class="button secondary" type="button">Copy setup link</button>
        <small>This link expires after two hours and becomes unusable as soon as the Trading Admin creates their password.</small>
      </div>
      <a class="back" href="/">← Back to Super Signals</a>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : '');
    const prefilledEmail = params.get('email');
    if (prefilledEmail) document.getElementById('email').value = prefilledEmail;
    const notice = document.getElementById('notice');
    const form = document.getElementById('form');
    const submit = document.getElementById('submit');
    const result = document.getElementById('result');
    const setupLink = document.getElementById('setupLink');
    function showNotice(message, ok=false){notice.innerHTML='';const el=document.createElement('div');el.className='notice '+(ok?'ok':'err');el.textContent=message;notice.appendChild(el)}
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); submit.disabled=true; submit.textContent='Creating setup link…'; notice.innerHTML=''; result.classList.remove('show');
      try {
        const response = await fetch('/admin/accounts/trading-admins/setup', {method:'POST',credentials:'include',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,display_name:document.getElementById('name').value})});
        const body = await response.json();
        if (!response.ok) { const detail = body && body.detail; throw new Error(typeof detail === 'string' ? detail : (detail && detail.message) || 'Administrator setup could not be created.'); }
        const link = `${location.origin}/admin-setup.html#token=${encodeURIComponent(body.setup_token)}`;
        setupLink.value=link; result.classList.add('show'); showNotice(`${body.display_name} is now whitelisted as Trading Admin. Send the setup link privately.`, true);
      } catch (error) { showNotice(error instanceof Error ? error.message : 'Administrator setup could not be created.'); }
      finally { submit.disabled=false; submit.textContent='Whitelist & create setup link'; }
    });
    document.getElementById('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(setupLink.value); showNotice('Setup link copied. Send it directly to Rikke.', true); }
      catch { setupLink.focus(); setupLink.select(); showNotice('Press and hold the selected link to copy it.'); }
    });
  </script>
</body>
</html>
