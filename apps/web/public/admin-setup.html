<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Smart Signals — Trading Admin Setup</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#073433 0,#02151d 32%,#020710 70%);color:#f4f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 18px}.shell{width:min(620px,100%);margin:0 auto}.logo{display:block;width:min(360px,80vw);height:auto;margin:0 auto 24px}.card{background:rgba(6,17,29,.94);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.eyebrow{color:#58e3cf;font-size:.82rem;letter-spacing:.22em;font-weight:800;text-transform:uppercase}.card h1{font-size:clamp(2rem,8vw,3.2rem);line-height:1.02;margin:12px 0 16px}.intro{color:#aab4c3;line-height:1.6;margin:0 0 22px}.form{display:grid;gap:17px}.form label{display:grid;gap:8px;font-weight:700}.form input{width:100%;border:1px solid rgba(255,255,255,.14);background:#0c1621;color:#fff;border-radius:15px;padding:15px 16px;font:inherit}.button{border:0;border-radius:15px;padding:15px 18px;font:inherit;font-weight:900;background:linear-gradient(110deg,#26ded2,#7cff48);color:#03120e;cursor:pointer}.button:disabled{opacity:.55}.notice{margin:16px 0;padding:14px 16px;border-radius:14px;line-height:1.45}.notice.ok{background:rgba(66,219,151,.11);border:1px solid rgba(66,219,151,.25);color:#bff5dc}.notice.err{background:rgba(255,106,124,.1);border:1px solid rgba(255,106,124,.25);color:#ffc1c9}.success{display:none}.success.show{display:block}.back{display:inline-block;margin-top:16px;color:#95a5b7;text-decoration:none}
  </style>
</head>
<body>
  <main class="shell">
    <img class="logo" src="/super-signals-logo.png" alt="Smart Signals" />
    <section class="card">
      <div class="eyebrow">Trading Admin setup</div>
      <h1>Create your password</h1>
      <p class="intro">This is a single-use administrator setup link. It stays valid until you use it or the Owner deliberately replaces it. Choose a private password of at least 12 characters.</p>
      <div id="notice"></div>
      <form id="form" class="form">
        <label>New password<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></label>
        <label>Confirm password<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></label>
        <button id="submit" class="button" type="submit">Create password</button>
      </form>
      <div id="success" class="success">
        <a class="button" style="display:block;text-align:center;text-decoration:none;margin-top:16px" href="/">Sign in to Smart Signals</a>
      </div>
      <a class="back" href="/">← Back to sign in</a>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : '');
    const token = params.get('token') || '';
    const notice = document.getElementById('notice');
    const form = document.getElementById('form');
    const submit = document.getElementById('submit');
    const success = document.getElementById('success');
    function showNotice(message, ok=false){notice.innerHTML='';const el=document.createElement('div');el.className='notice '+(ok?'ok':'err');el.textContent=message;notice.appendChild(el)}
    if (!token) { showNotice('This setup link is incomplete. Ask the Owner Admin for a fresh link.'); form.style.display='none'; }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password=document.getElementById('password').value; const confirm=document.getElementById('confirm').value;
      if (password !== confirm) { showNotice('The two passwords do not match.'); return; }
      submit.disabled=true; submit.textContent='Securing account…'; notice.innerHTML='';
      try {
        const response=await fetch('/auth/admin-setup',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({token,password})});
        const body=await response.json();
        if (!response.ok) { const detail=body&&body.detail; throw new Error(typeof detail==='string'?detail:(detail&&detail.message)||'Administrator setup could not be completed.'); }
        history.replaceState({},'',location.pathname); form.style.display='none'; success.classList.add('show'); showNotice(`${body.email} is ready. You can sign in now.`,true);
      } catch(error) { showNotice(error instanceof Error?error.message:'Administrator setup could not be completed.'); }
      finally { submit.disabled=false; submit.textContent='Create password'; }
    });
  </script>
</body>
</html>
